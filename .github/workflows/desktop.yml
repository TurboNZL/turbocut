name: Desktop (Windows and Linux)

# Windows: installer (.exe) and a portable .exe. Linux: AppImage and .deb.
# Download from the run's "Artifacts" section.

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
  workflow_call:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact: TurboCut-windows
            files: |
              release/TurboCut-*-windows-*.exe
          - os: ubuntu-latest
            name: Linux
            artifact: TurboCut-linux
            files: |
              release/TurboCut-*-linux-*.AppImage
              release/TurboCut-*-linux-*.deb
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # No --ignore-scripts here: Electron downloads its binary in a post-install step (allowed in package.json).
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30
