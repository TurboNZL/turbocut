name: Android APK

# Builds an installable debug APK. Download it from the run's "Artifacts" section, copy it to the phone and open it
# (Android asks you to allow installing from that app once). Every build is signed with the same fixed debug key and
# has a higher version code than the last, so a new APK installs over the old one without uninstalling.

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
  workflow_call:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the web app and copy it into the Android project
        run: |
          pnpm build
          pnpm exec cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PtcVersionCode=${{ github.run_number }} -PtcVersionName=0.0.${{ github.run_number }}
      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TurboCut-android-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TurboCut-android-apk
          path: TurboCut-android-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30
