name: Build

# Builds the Android APK and the Windows and Linux apps, then publishes them as a GitHub Release with every
# file attached on its own, no zip. Versions are Year.Month.Update (2026.10.3): the update number counts up
# within the month and is picked here, so every push gets the next one. Releases are tagged v<version>.
# Builds from main are normal releases; builds from other branches are pre-releases. The apps check this
# list to offer updates.

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Pick version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      code: ${{ steps.pick.outputs.code }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: pick
        run: |
          Y=$(date -u +%Y)
          M=$(date -u +%-m)
          LAST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName \
            --jq "[.[].tagName | select(startswith(\"v$Y.$M.\")) | ltrimstr(\"v$Y.$M.\") | tonumber] | max // 0")
          N=$((LAST + 1))
          echo "version=$Y.$M.$N" >> "$GITHUB_OUTPUT"
          # Android needs an integer that always grows: YY * 1,000,000 + month * 10,000 + update
          echo "code=$(( (Y - 2000) * 1000000 + M * 10000 + N ))" >> "$GITHUB_OUTPUT"
          echo "Version $Y.$M.$N"

  android:
    needs: version
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Stamp the version
        run: npm pkg set version=${{ needs.version.outputs.version }}
      - name: Build the web app and copy it into the Android project
        run: |
          pnpm build
          pnpm exec cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PtcVersionCode=${{ needs.version.outputs.code }} -PtcVersionName=${{ needs.version.outputs.version }}
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk turbocut-${{ needs.version.outputs.version }}-android.apk
      # Artifacts are only the hand-over to the release job; people download from the Release.
      - uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: turbocut-${{ needs.version.outputs.version }}-android.apk
          if-no-files-found: error
          retention-days: 1

  desktop:
    needs: version
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            id: windows
            files: |
              release/turbocut-*.exe
              release/latest.yml
          - os: ubuntu-latest
            name: Linux
            id: linux
            files: |
              release/turbocut-*-linux-*.AppImage
              release/turbocut-*-linux-*.deb
              release/latest-linux.yml
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # No --ignore-scripts here: Electron downloads its binary in a post-install step (allowed in package.json).
      - run: pnpm install --frozen-lockfile
      - name: Stamp the version
        run: npm pkg set version=${{ needs.version.outputs.version }}
      - run: pnpm build
      - run: pnpm exec electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.id }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 1

  web:
    needs: version
    name: Web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Stamp the version
        run: npm pkg set version=${{ needs.version.outputs.version }}
      - run: pnpm build
      - name: Bundle the app with its server
        run: |
          mkdir -p bundle/turbocut-web
          cp -r dist bundle/turbocut-web/app
          cp scripts/serve.mjs bundle/turbocut-web/serve.mjs
          printf 'TurboCut web bundle\n\nInstall Node.js 20 or newer, then in this folder run:\n\n  node serve.mjs --https\n\nOpen the address it prints on any device on your network and accept the certificate warning once.\nWithout --https only the computer running it can export video (browsers require a secure page).\n' > bundle/turbocut-web/README.txt
          (cd bundle && zip -qr ../turbocut-${{ needs.version.outputs.version }}-web.zip turbocut-web)
      - uses: actions/upload-artifact@v4
        with:
          name: build-web
          path: turbocut-${{ needs.version.outputs.version }}-web.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: [version, android, desktop, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: files
      - name: List what will be published
        run: ls -lh files
      - name: Create the release
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          SHORT="${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then KIND=""; else KIND="--prerelease"; fi
          gh release create "v$VERSION" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            $KIND \
            --title "TurboCut $VERSION" \
            --notes "Build of commit $SHORT on \`${GITHUB_REF_NAME}\`.

          - **Android:** the \`-android.apk\`. Open it on the phone and allow installing from that source once. Later versions install over earlier ones.
          - **Windows:** \`-windows-setup.exe\` installs it (and then updates itself); \`-windows-portable.exe\` runs without installing. Windows warns about an unknown publisher because the build is not code-signed.
          - **Linux:** \`.AppImage\` (\`chmod +x\` it, then run it; it updates itself) or the \`.deb\` (\`sudo apt install ./file.deb\`).
          - **Your own web server:** unzip the \`-web.zip\` and run \`node serve.mjs --https\` (Node.js 20+). Open the address it prints on any device on your network.
          - \`latest.yml\` and \`latest-linux.yml\` are what the desktop app reads to find updates."
      - name: Keep only the five newest releases
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq 'map(select(.tagName | test("^(v[0-9]|build-)"))) | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | xargs -r -I{} gh release delete {} --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
